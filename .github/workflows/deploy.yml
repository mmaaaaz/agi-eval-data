name: deploy

# Deploys to Cloudflare run from GitHub — never from a local machine.
# Per-app path filtering: shared package changes deploy BOTH apps;
# web-only changes deploy the site; relay-only changes deploy the worker.
# The sync bot's data commits (data/latest.json) skip this workflow entirely.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "data/**"
      - "scripts/og/**"
      # THE SCRIPTS THAT BUILD THE DEPLOYED ARTIFACT. Changing one of these changed what the
      # site serves, and did NOT re-run the deploy - **the site would serve stale data built by
      # the old script.** `13_ci_resolves.py` now checks exactly this: a workflow must trigger
      # on the scripts its own steps run, by exact path or by directory wildcard.
      - "scripts/build_data.py"
      - "scripts/metro_build_data.py"
      - "scripts/open_models_public.py"
      # a check that runs before the relay deploy; re-running is cheap and correct
      - "scripts/db/check_migrations.py"
      - "scripts/db/diagnose_remote.py"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      # EVERY JOB, INCLUDING THE SITE. Without this there is NO WAY TO DEPLOY THE WEB APP
      # ON DEMAND: a push only deploys what its own diff touched, and a manual run has no diff
      # at all (see the note below the filters), so `deploy pages` is skipped on both.
      #
      # Measured in round 134: the live bundle still carried `Ask AI` and `chat with the data`
      # - strings deleted from the source two rounds earlier. **The code was right, the
      # secrets were right, and the site was stale**, with every run reporting success.
      force_all:
        description: "deploy everything, ignoring the changed-path filter"
        type: boolean
        default: false
      # kept for compatibility; force_all supersedes it
      force_grip:
        description: "deploy grip pages even if no grip frontend paths changed"
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      relay: ${{ steps.filter.outputs.relay }}
      metro_web: ${{ steps.filter.outputs.metro_web }}
      metro_app: ${{ steps.filter.outputs.metro_app }}
      grip_web: ${{ steps.filter.outputs.grip_web }}
      grip_app: ${{ steps.filter.outputs.grip_app }}
      secrets: ${{ steps.secrets.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        # push only: workflow_dispatch has no base to diff against — outputs
        # stay empty there and the force_grip input drives grip deploys
        if: github.event_name == 'push'
        with:
          filters: |
            # THE RELAY FILTER WAS MISSING ENTIRELY, AND THE OUTPUT WAS DECLARED.
            #
            # `changes.outputs.relay` has been wired to `steps.filter.outputs.relay` since the
            # job was written - but there was no `relay:` key in this block. So the output was
            # ALWAYS EMPTY and `deploy relay` was skipped on every run since it existed.
            #
            # Found in round 140 by probing the DEPLOYED relay: it still answered
            # `questions API is locked`, a global gate the code removed rounds ago, and
            # `/api/changes` returned 404. **The site's authoring flow calls those endpoints.**
            #
            # The failure is silent by construction: a filter key that does not exist produces
            # an empty output, and an empty output reads exactly like "nothing changed".
            relay:
              - "apps/relay/**"
              - "packages/questions-api/**"
              - "packages/shared/**"
              - "scripts/db/check_migrations.py"
              - "scripts/db/diagnose_remote.py"
              - "bun.lock"
              - "package.json"
              - "turbo.json"
            web:
              - "apps/web/**"
              - "packages/shared/**"
              - "packages/site/**"
              - "scripts/og/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
            metro_web:
              - "apps/metro-web/**"
              - "packages/site/**"
              - "packages/shared/**"
              - "data/metro.json"
              - "scripts/metro_build_data.py"
              - "scripts/og/**"
            metro_app:
              - "apps/metro-relay/**"
              - "packages/shared/**"
              - "packages/questions-api/**"
            # grip frontend only — grip DATA lives in data/grip/ but is fetched
            # at runtime from raw.githubusercontent, so artifact re-bakes never
            # need a site rebuild
            grip_web:
              - "apps/grip-web/**"
              - "packages/site/**"
              - "packages/shared/**"
              - "data/open-models/**"
              - "scripts/open_models_public.py"
              - "bun.lock"
              - "scripts/og/**"
            grip_app:
              - "apps/grip-sync/**"

      - id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            # A SKIPPED DEPLOY MUST NOT LOOK LIKE A SUCCESSFUL ONE.
            #
            # Every deploy job is gated on this output, so with the secrets unset the workflow
            # runs green and deploys NOTHING. The message used to go only to $GITHUB_OUTPUT - a
            # file nobody reads - so the run summary said nothing at all. **A green run that
            # shipped nothing is the same defect as a pipeline that exits 0 having done no work.**
            #
            # A WARNING, NOT A FAILURE: a fork legitimately has no secrets, and failing there
            # would be wrong. An annotation surfaces it in the run summary, where a person looks.
            echo "::warning title=Deploys are SKIPPED::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so every deploy job is gated off and this run will ship nothing."
            # AND A JOB SUMMARY, BECAUSE A ::warning IS ONE LINE IN A COLLAPSED STEP.
            #
            # Measured in round 133: `deploy pages` had been SKIPPED on EVERY run, and the only
            # trace was an annotation nobody opened. The site never updated and the workflow
            # reported success each time. **A skipped deploy that looks green is the same defect
            # as a pipeline that exits 0 having done no work** - the third costume it has worn.
            #
            # SINGLE quotes throughout: backticks inside double quotes EXECUTE in shell, which is
            # how a summary about secret names becomes a command substitution.
            {
              echo '## Deploys are SKIPPED - nothing shipped'
              echo ''
              echo 'Every deploy job is gated on this step, and it did not pass, so **this run'
              echo 'published nothing** while reporting success.'
              echo ''
              echo '| secret | set |'
              echo '| --- | --- |'
              echo "| CLOUDFLARE_API_TOKEN | $HAS_TOKEN |"
              echo "| CLOUDFLARE_ACCOUNT_ID | $HAS_ACCOUNT |"
              echo ''
              echo 'Set them under Settings -> Secrets and variables -> Actions -> Secrets,'
              echo 'then re-run this workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not set - DEPLOYS ARE SKIPPED."
            echo "Set them under Settings -> Secrets and variables -> Actions -> Secrets."
          fi

  relay:
    name: deploy relay
    needs: changes
    if: needs.changes.outputs.secrets == 'true' && (inputs.force_all == true || needs.changes.outputs.relay == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx turbo run typecheck

      # MIGRATIONS FIRST, THEN CODE. The relay was deployed with NO migration step, so a
      # change that needs a new column shipped the code and left the database behind - **the
      # API would fail in production on the path a user is using**, and nothing in this
      # repository could see it, because `check_migrations.py` validates the API against the
      # migrations in the REPO, not against what is actually deployed.
      #
      # `wrangler d1 migrations apply` TRACKS what it has applied, so this is a no-op when there
      # is nothing new. That is what makes it safe to run on every deploy rather than only when
      # someone remembers.
      # TESTS AND THE SCHEMA CONTRACT, BEFORE ANYTHING SHIPS.
      #
      # `deploy.yml` NEVER RAN THE TESTS - only a typecheck - and every deploy job `needs:`
      # only `changes`, NOT `ci`. Both workflows trigger on the same push, so **a deploy could
      # complete while CI was failing**, and nothing connected the guard suite to what ships.
      #
      # A cross-workflow dependency would need `workflow_run` and a restructure. Running the
      # checks HERE makes the deploy SELF-SUFFICIENT instead: it cannot ship something that
      # fails its own tests, whatever else is happening on the same push.
      - name: Test
        run: bunx turbo run test

      - name: Check the API against the schema (read-only)
        run: python3 scripts/db/check_migrations.py > /dev/null

      # DIAGNOSE BEFORE APPLYING, SO A HALF-APPLIED MIGRATION IS NAMED AND NOT GUESSED AT.
      #
      # Round 140: this job ran for the first time and failed with a raw
      # `duplicate column name: family`. The cause was migration 0005, whose ALTERs had taken
      # effect before its six-term UNION failed - and D1 records a migration BY NAME, only when
      # the whole file succeeds. **A raw SQLite error names the symptom and not the cause.**
      #
      # `--continue-on-error` is NOT used: a diagnosed partial state should stop the deploy and
      # point at docs/relay-migration-repair.md, not half-apply something else.
      - name: Diagnose the remote schema (names a half-applied migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # THE OUTPUT GOES TO THE JOB SUMMARY, NOT ONLY THE LOG.
          #
          # The repository is private, so reading the runner log needs a token. The summary is
          # visible to anyone who opens the run - **and it is where the owner can copy the cause
          # from.** A refusal that can only be read by someone with a token is half a check.
          set +e
          python scripts/db/diagnose_remote.py --db agi-eval-questions --require-remote \
            2>&1 | tee /tmp/diag.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo '## The relay deploy cannot read the remote database'
              echo ''
              echo 'This is why `Apply migrations` fails. It is **not** a schema problem:'
              echo 'the diagnostic reads the applied list before anything else, and it could not.'
              echo ''
              echo '```'
              tail -25 /tmp/diag.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Apply migrations (before the code that needs them)
        # CAPTURE THE OUTPUT AND REPORT IT, BECAUSE THE LOG IS NOT ALWAYS READABLE.
        #
        # This step failed on every deploy run from round 140 onward while the migrations were
        # in fact applied - verified by reading d1_migrations from the remote, and by running
        # the same command locally, which exits 0. **The repository is private, so the runner's
        # log needs a token the owner holds and I do not.**
        #
        # So the step now writes wrangler's own output into the JOB SUMMARY on failure. That is
        # the one place a person sees without opening anything, and it means the next failure
        # explains itself instead of needing another round of guessing.
        run: |
          set +e
          bunx --bun wrangler@4.125.0 d1 migrations apply agi-eval-questions --remote 2>&1 | tee /tmp/migrate.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo '## Apply migrations FAILED'
              echo ''
              echo 'wrangler exited '\''$rc'\''. Its output:'
              echo ''
              echo '```'
              tail -40 /tmp/migrate.log
              echo '```'
              echo ''
              echo 'The migrations themselves were applied on 2026-10-14 and `d1_migrations` holds'
              echo 'all eight. If this fails while `Diagnose the remote schema` succeeded, the'
              echo 'cause is in the text above and not in the schema.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy relay
        run: bunx --bun wrangler@4.125.0 deploy
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: deploy pages
    needs: changes
    if: needs.changes.outputs.secrets == 'true' && (inputs.force_all == true || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Bake data artifacts (parquet + stats)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow && python scripts/build_data.py

      - name: Build site
        run: bunx turbo run build --filter=@agi-eval/web
        env:
          VITE_REPO: ${{ github.repository }}

      - name: Stamp per-route OG tags
        run: node scripts/og/gen-route-html.mjs

      - name: Test
        run: bunx turbo run test

      - name: Deploy pages
        run: bunx --bun wrangler@4.125.0 pages deploy dist --project-name=agi-eval-data --branch=main --commit-dirty=true
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  metro-relay:
    name: deploy metro relay
    needs: changes
    if: needs.changes.outputs.secrets == 'true' && (inputs.force_all == true || needs.changes.outputs.metro_app == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-metro
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Test
        run: bunx turbo run test

      - name: Deploy metro relay
        run: bunx --bun wrangler@4.125.0 deploy
        working-directory: apps/metro-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  metro-pages:
    name: deploy metro pages
    needs: changes
    if: needs.changes.outputs.secrets == 'true' && (inputs.force_all == true || needs.changes.outputs.metro_web == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-metro
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Bake metro sync feed
        run: python scripts/metro_build_data.py

      - name: Render metro OG cards
        run: |
          cd scripts/og
          npm install --no-fund --no-audit
          node render-metro-og.mjs

      - name: Build metro site
        run: bunx turbo run build --filter=@metro/web
        env:
          VITE_REPO_METRO: ${{ github.repository }}

      - name: Stamp per-route OG tags
        run: node scripts/og/gen-route-html.mjs metro

      - name: Test
        run: bunx turbo run test

      - name: Deploy metro pages
        run: bunx --bun wrangler@4.125.0 pages deploy dist --project-name=metro-eval --branch=main --commit-dirty=true
        working-directory: apps/metro-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  grip-pages:
    name: deploy grip pages
    needs: changes
    if: needs.changes.outputs.secrets == 'true' && (inputs.force_all == true || inputs.force_grip == true || needs.changes.outputs.grip_web == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-grip
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Publish open-model artifact to public/
        run: python scripts/open_models_public.py

      - name: Build grip site
        run: bunx turbo run build --filter=@grip/web

      - name: Stamp per-route OG tags
        run: node scripts/og/gen-route-html.mjs grip

      - name: Test
        run: bunx turbo run test

      - name: Deploy grip pages
        run: bunx --bun wrangler@4.125.0 pages deploy dist --project-name=grip-eval --branch=main --commit-dirty=true
        working-directory: apps/grip-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  grip-sync:
    name: deploy grip sync worker
    needs: changes
    if: needs.changes.outputs.secrets == 'true' && (inputs.force_all == true || needs.changes.outputs.grip_app == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Test
        run: bunx turbo run test

      - name: Deploy grip sync worker
        run: bunx --bun wrangler@4.125.0 deploy
        working-directory: apps/grip-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
