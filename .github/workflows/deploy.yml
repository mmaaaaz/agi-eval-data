name: deploy

# Deploys to Cloudflare run from GitHub — never from a local machine.
# Per-app path filtering: shared package changes deploy BOTH apps;
# web-only changes deploy the site; relay-only changes deploy the worker.
# The sync bot's data commits (data/latest.json) skip this workflow entirely.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "data/**"
      - "scripts/og/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      force_grip:
        description: "deploy grip pages even if no grip frontend paths changed"
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      relay: ${{ steps.filter.outputs.relay }}
      metro_web: ${{ steps.filter.outputs.metro_web }}
      metro_app: ${{ steps.filter.outputs.metro_app }}
      grip_web: ${{ steps.filter.outputs.grip_web }}
      grip_app: ${{ steps.filter.outputs.grip_app }}
      secrets: ${{ steps.secrets.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        # push only: workflow_dispatch has no base to diff against — outputs
        # stay empty there and the force_grip input drives grip deploys
        if: github.event_name == 'push'
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/shared/**"
              - "packages/site/**"
              - "scripts/og/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
            metro_web:
              - "apps/metro-web/**"
              - "packages/site/**"
              - "packages/shared/**"
              - "data/metro.json"
              - "scripts/metro_build_data.py"
              - "scripts/og/**"
            metro_app:
              - "apps/metro-relay/**"
              - "packages/shared/**"
              - "packages/questions-api/**"
            # grip frontend only — grip DATA lives in data/grip/ but is fetched
            # at runtime from raw.githubusercontent, so artifact re-bakes never
            # need a site rebuild
            grip_web:
              - "apps/grip-web/**"
              - "packages/site/**"
              - "packages/shared/**"
              - "bun.lock"
              - "scripts/og/**"
            grip_app:
              - "apps/grip-sync/**"

      - id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets" >> "$GITHUB_OUTPUT"
          fi

  relay:
    name: deploy relay
    needs: changes
    if: needs.changes.outputs.relay == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx turbo run typecheck

      - name: Deploy relay
        run: bunx --bun wrangler@4.125.0 deploy
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: deploy pages
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Bake data artifacts (parquet + stats)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow && python scripts/build_data.py

      - name: Build site
        run: bunx turbo run build --filter=@agi-eval/web
        env:
          VITE_REPO: ${{ github.repository }}

      - name: Stamp per-route OG tags
        run: node scripts/og/gen-route-html.mjs

      - name: Deploy pages
        run: bunx --bun wrangler@4.125.0 pages deploy dist --project-name=agi-eval-data --branch=main --commit-dirty=true
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  metro-relay:
    name: deploy metro relay
    needs: changes
    if: needs.changes.outputs.metro_app == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-metro
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Deploy metro relay
        run: bunx --bun wrangler@4.125.0 deploy
        working-directory: apps/metro-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  metro-pages:
    name: deploy metro pages
    needs: changes
    if: needs.changes.outputs.metro_web == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-metro
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Bake metro sync feed
        run: python scripts/metro_build_data.py

      - name: Render metro OG cards
        run: |
          cd scripts/og
          npm install --no-fund --no-audit
          node render-metro-og.mjs

      - name: Build metro site
        run: bunx turbo run build --filter=@metro/web
        env:
          VITE_REPO_METRO: ${{ github.repository }}

      - name: Stamp per-route OG tags
        run: node scripts/og/gen-route-html.mjs metro

      - name: Deploy metro pages
        run: bunx --bun wrangler@4.125.0 pages deploy dist --project-name=metro-eval --branch=main --commit-dirty=true
        working-directory: apps/metro-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  grip-pages:
    name: deploy grip pages
    needs: changes
    if: needs.changes.outputs.grip_web == 'true' || inputs.force_grip == true
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-grip
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build grip site
        run: bunx turbo run build --filter=@grip/web

      - name: Stamp per-route OG tags
        run: node scripts/og/gen-route-html.mjs grip

      - name: Deploy grip pages
        run: bunx --bun wrangler@4.125.0 pages deploy dist --project-name=grip-eval --branch=main --commit-dirty=true
        working-directory: apps/grip-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  grip-sync:
    name: deploy grip sync worker
    needs: changes
    if: needs.changes.outputs.grip_app == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Deploy grip sync worker
        run: bunx --bun wrangler@4.125.0 deploy
        working-directory: apps/grip-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
