name: sync

on:
  schedule:
    - cron: "*/10 * * * *"       # every 10 min — change-detection below prevents empty commits;
                                  # public repo ⇒ unlimited Actions minutes; raw CDN TTL ~5 min
                                  # makes ~10 min the effective freshness floor anyway
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bulk share pass (first run only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Scan Drive metadata → data/latest.json
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python scripts/drive_scan.py --ci

      - name: Set up Node for OG render
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect real change (ignore scan timestamp)
        id: change
        run: |
          git show HEAD:data/latest.json > /tmp/prev.json 2>/dev/null || echo "{}" > /tmp/prev.json
          python3 - <<'PY'
          import json, os
          def norm(path):
              try:
                  d = json.load(open(path))
              except Exception:
                  return "{}"
              d.get("meta", {}).pop("scannedAt", None)
              return json.dumps(d, sort_keys=True)
          changed = norm("/tmp/prev.json") != norm("data/latest.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"changed={str(changed).lower()}")
          print(f"real change detected: {changed}")
          PY
      - name: Render OG cards (takumi) — only when stats changed
        if: steps.change.outputs.changed == 'true'
        run: |
          cd scripts/og
          npm install --no-fund --no-audit
          node render-og.mjs

      - name: Share-sync new images (delta)
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python scripts/share_sync.py --max ${{ github.event.inputs.bootstrap == 'true' && '100000' || '400' }}

      - name: Commit artifact
        run: |
          git config user.name  "agi-eval-bot"
          git config user.email "bot@agi-eval-data.local"
          git add data/latest.json
          if [ "${{ steps.change.outputs.changed }}" = "true" ]; then
            git add og/
          fi
          if git diff --cached --quiet; then
            echo "No changes since last sync."
          else
            git commit -m "chore(data): sync $(date -u '+%Y-%m-%dT%H:%MZ')"
          fi
          # main may have moved while we scanned — rebase and retry once
          git fetch origin main
          git rebase origin/main || git rebase --abort
          if git diff --quiet origin/main; then
            echo "nothing to push"
          else
            git push
          fi

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'sync-failed', state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Sync failed @ ${new Date().toISOString()}`,
                labels: ['sync-failed'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
