name: sync-metro

# Daily metro dataset pipeline: folder-scoped Drive scan → data/metro.json →
# change-gated commit. The commit triggers the deploy workflow (metro jobs).

on:
  schedule:
    - cron: "0 * * * *" # hourly — new dataset, wants fresh data
  workflow_dispatch:

concurrency:
  group: sync-metro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Scan Drive folder → data/metro.json
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python scripts/metro_scan.py --ci

      - name: Detect real change (ignore scan timestamp)
        id: change
        run: |
          git show HEAD:data/metro.json > /tmp/prev.json 2>/dev/null || echo "{}" > /tmp/prev.json
          python3 - <<'PY'
          import json, os
          def norm(path):
              try:
                  d = json.load(open(path))
              except Exception:
                  return "{}"
              d.get("meta", {}).pop("scannedAt", None)
              return json.dumps(d, sort_keys=True)
          changed = norm("/tmp/prev.json") != norm("data/metro.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"changed={str(changed).lower()}")
          print(f"real change detected: {changed}")
          PY

      - name: Commit artifact
        run: |
          git config user.name  "agi-eval-bot"
          git config user.email "bot@agi-eval-data.local"
          git add data/metro.json
          if git diff --cached --quiet; then
            echo "No changes since last sync."
          else
            git commit -m "chore(metro): sync $(date -u '+%Y-%m-%dT%H:%MZ')"
          fi
          git fetch origin main
          git pull --rebase origin main   # last writer wins; next sync re-applies the data
          if git diff --quiet origin/main; then
            echo "nothing to push"
          else
            git push origin HEAD:main
          fi

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'sync-failed', state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Metro sync failed @ ${new Date().toISOString()}`,
                labels: ['sync-failed'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
