name: sync-share

on:
  schedule:
    - cron: "*/30 * * * *"         # link-share pass every 30 min — keeps thumbnails working
                                  # for new uploads between daily data scans
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bulk share pass (first run only)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Share-sync new images + PDFs (delta)
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python scripts/share_sync.py --max ${{ github.event.inputs.bootstrap == 'true' && '100000' || '400' }}

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'sync-failed', state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Sync failed @ ${new Date().toISOString()}`,
                labels: ['sync-failed'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      # AN ALERT THAT CANNOT RE-FIRE IS NOT AN ALERT.
      #
      # The failure step opens an issue ONLY IF none is open. Nothing ever closed one, so after
      # the first failure the issue stayed open for good and **every later failure created
      # nothing and notified nobody** - the worst state, because it looks like alerting.
      #
      # Closing on SUCCESS is what makes the next failure a new event.
      - name: Alert on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'sync-failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: 'open',
            });
            for (const i of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `Recovered at ${new Date().toISOString()} - run ${context.runId} succeeded.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
