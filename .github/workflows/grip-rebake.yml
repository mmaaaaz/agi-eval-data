name: grip-rebake

# Upstream (bilaljawaid980/Geomatric-Reasoning-Benchmark-Dataset) is the single
# source of truth. This job re-bakes our derived artifacts whenever upstream
# moves — hourly, on demand, or right after the grip-sync worker lands an
# override batch (repository_dispatch). No-op when upstream is unchanged.

on:
    # THE HOURLY SCHEDULE IS STOPPED, BY THE OWNER'S DECISION.
    #
    # The grip paper is published and grip needs nothing more. An hourly job that rebuilds
    # derived artifacts from an upstream repo that is no longer moving is pure waste - and it
    # commits to main every time, which is what has been racing every one of my own pushes.
    #
    # THE TRIGGERS ARE KEPT, NOT DELETED: `workflow_dispatch` so a re-bake can still be run by
    # hand, and `repository_dispatch: grip-rebake` because that is how grip-sync asks for one
    # after landing an override batch. **Stopping a schedule is reversible; deleting a trigger
    # is a capability removed.**
    # schedule:
    #   - cron: "7 * * * *" # hourly at :07 - STOPPED 2026-10-14
  workflow_dispatch:
    inputs:
      force:
        description: "re-bake even if upstream sha unchanged"
        type: boolean
        default: false
  repository_dispatch:
    types: [grip-rebake]

permissions:
  contents: write
  issues: write

concurrency:
  group: grip-rebake
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare upstream HEAD with baked marker
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/bilaljawaid980/Geomatric-Reasoning-Benchmark-Dataset.git HEAD | cut -f1)
          BAKED=$(python -c "import json;print(json.load(open('data/grip/tree.json')).get('bakedFromCommit',''))" 2>/dev/null || echo "")
          FORCE="${{ inputs.force || github.event.client_payload.force || 'false' }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          if [ "$SHA" = "$BAKED" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "upstream unchanged ($SHA) — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "upstream $SHA vs baked '$BAKED' — re-baking"
          fi

      - name: Fetch annotations + overrides from upstream
        if: steps.upstream.outputs.skip == 'false'
        env:
          # authenticated api.github.com calls (~40/run vs 5k/hr cap); the
          # anonymous 60/hr pool shared by all runners 403s unpredictably
          GITHUB_TOKEN: ${{ github.token }}
        # --force must reach grip_fetch too: on an unchanged upstream it
        # otherwise short-circuits without populating .grip-cache and the
        # bake step crashes ("no .grip-cache/manifest.json")
        run: python scripts/grip_fetch.py ${{ steps.upstream.outputs.force == 'true' && '--force' || '' }}

      - name: Bake artifacts
        if: steps.upstream.outputs.skip == 'false'
        run: python scripts/grip_scan.py

      - name: Validate (fail on drift or bad overrides)
        if: steps.upstream.outputs.skip == 'false'
        run: python scripts/grip_validate.py

      - name: Copy to public/
        if: steps.upstream.outputs.skip == 'false'
        run: python scripts/grip_sync_public.py

      - name: Commit + push artifacts
        if: steps.upstream.outputs.skip == 'false'
        run: |
          git config user.name "grip-rebake-bot"
          git config user.email "grip-rebake-bot@users.noreply.github.com"
          PRE=$(git rev-parse HEAD)
          git add data/grip apps/grip-web/public/data
          if ! git diff --cached --quiet; then
            git commit -m "chore(grip): re-bake artifacts from upstream ${{ steps.upstream.outputs.sha }}"
          fi
          # version.json = the client's pin target (artifact commit sha). It must
          # reference OUR repo (jsDelivr @<commit> resolves here), so it can only
          # be known AFTER the artifact commit — hence stamped here, not in
          # grip_scan. Stamp when artifacts changed OR the file is missing
          # (bootstrap); otherwise stay silent so runs converge with no churn.
          if [ "$(git rev-parse HEAD)" != "$PRE" ] || [ ! -f data/grip/version.json ]; then
            printf '{"commit": "%s", "builtAt": "%s"}\n' \
              "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/grip/version.json
            git add data/grip/version.json
            git commit -m "chore(grip): stamp version.json -> $(git rev-parse --short HEAD) (client pin target)"
          fi
          git push

  notify-on-failure:
    name: open issue when re-bake fails
    needs: rebake
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Open or update a drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="grip re-bake failing — site may go stale"
          BODY="Upstream re-bake failed at ${GITHUB_SHA::7}. The site keeps serving the last good bake, but it may be stale. Run logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

  # THE OTHER HALF, AND IT WAS MISSING WHILE THE FAILURE HALF WAS DONE WELL.
  #
  # This workflow's failure step is the BEST of the five: it COMMENTS on an open issue rather than
  # only creating one, so a second failure does notify. But nothing closed the issue, so a
  # recovered re-bake left a "site may go stale" issue open for good - **and a stale warning is one
  # people learn to ignore.**
  notify-on-recovery:
    name: close the drift issue when re-bake succeeds
    needs: rebake
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="grip re-bake failing — site may go stale"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Recovered: the re-bake succeeded in run $GITHUB_RUN_ID."
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY"
          fi
